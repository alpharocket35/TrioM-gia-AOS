<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>AOS de TrioMégia</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="boot" class="boot">
  <div class="boot-logo">α</div>
  <div class="boot-title">AOS de TrioMégia</div>
  <div class="boot-sub">Démarrage de TrioMégia...</div>
  <div class="boot-bar"><i></i></div>
</div>

<div id="desktop" class="desktop hidden">
  <div class="wallpaper-overlay"></div>
  <div id="icons" class="desktop-icons">
    <button class="desktop-icon" data-app="files"><span>📁</span><b>Fichiers</b></button>
    <button class="desktop-icon" data-app="notes"><span>📝</span><b>Notes</b></button>
    <button class="desktop-icon" data-app="calculator"><span>🧮</span><b>Calculatrice</b></button>
    <button class="desktop-icon" data-app="terminal"><span>⌨️</span><b>Terminal</b></button>
    <button class="desktop-icon" data-app="browser"><span>🌐</span><b>Web</b></button>
    <button class="desktop-icon" data-app="settings"><span>⚙️</span><b>Réglages</b></button>
    <button class="desktop-icon gaming-icon" data-app="gaming"><span>🎮</span><b>TrioGaming</b></button>
  </div>

  <div id="windows"></div>
  <div id="contextMenu" class="context-menu hidden">
    <button data-action="newnote">📝 Nouvelle note</button>
    <button data-action="settings">⚙️ Personnaliser</button>
    <button data-action="refresh">🔄 Actualiser</button>
  </div>

  <div id="startMenu" class="start-menu hidden">
    <div class="start-head">
      <div class="avatar">T</div>
      <div><strong>AOS de TrioMégia</strong><small>Utilisateur local</small></div>
    </div>
    <div class="start-search">🔎 <input id="appSearch" placeholder="Rechercher une application..."></div>
    <div id="appList" class="app-list"></div>
    <div class="start-footer"><span id="startTime"></span><button id="themeToggle">☀️/🌙 Thème</button><button id="lockBtn">🔒 Verrouiller</button></div>
  </div>

  <div class="taskbar">
    <button id="startBtn" class="start-btn">α</button>
    <div id="taskButtons" class="task-buttons"></div>
    <div class="tray">
      <span>📶</span><span>🔊</span><span>🔋</span>
      <button id="clockBtn" class="clock"></button>
    </div>
  </div>
</div>

<div id="lockScreen" class="lock-screen hidden">
  <div class="lock-card">
    <div class="lock-alpha">TM</div>
    <h1>AOS de TrioMégia</h1>
    <p id="lockClock"></p>
    <button id="unlockBtn">Entrer dans AlphaOS</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
